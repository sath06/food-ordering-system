<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Food | Sathvika's Restaurant</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a class="brand" href="/">🍽️ Sathvika's Restaurant</a><nav><a href="/">Home</a><a href="/menu.html">Menu & Admin</a><a href="/cart.html">Cart <span class="cart-count">0</span></a><a href="/orders.html">Orders</a></nav></header><main class="page-shell narrow"><div class="page-title"><h1>Edit food item</h1><p>Load an item by its ID, edit the fields, and save them to MySQL.</p></div><section class="admin-form"><form id="loadForm"><label>Food ID<input type="number" id="foodId" min="1" required></label><button>Load food</button></form><hr><form id="updateForm" class="form-grid" hidden><label>Food name<input id="foodName" required></label><label>Category<input id="foodCategory" required></label><label>Price (₹)<input id="foodPrice" type="number" min="0" step="0.01" required></label><label>Availability<select id="foodAvailability"><option value="true">Available</option><option value="false">Unavailable</option></select></label><label class="full">Description<textarea id="foodDescription" rows="3"></textarea></label><button>Save changes to MySQL</button></form><p id="message" class="notice" role="status"></p><a href="/menu.html">← Back to menu</a></section></main><script src="common.js"></script><script src="update.js"></script></body></html>
