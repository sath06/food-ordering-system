<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu | Sathvika's Restaurant</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a class="brand" href="/">🍽️ Sathvika's Restaurant</a><nav><a href="/">Home</a><a class="active" href="/menu.html">Menu & Admin</a><a href="/cart.html">Cart <span class="cart-count">0</span></a><a href="/order.html">Place Order</a><a href="/orders.html">Orders</a></nav></header>
<main class="page-shell"><div class="page-title"><span class="eyebrow">FRESH FROM OUR KITCHEN</span><h1>Our Food Menu</h1><p>Add new items here. Every change is saved in MySQL Workbench.</p></div><section class="admin-form"><h2>Add a food item</h2><form id="addFoodForm" class="form-grid"><label>Food name<input id="food_name" required maxlength="120"></label><label>Category<input id="category" required maxlength="60" placeholder="Indian, Snacks, Dessert..."></label><label>Price (₹)<input id="price" type="number" min="0" step="0.01" required></label><label>Availability<select id="availability"><option value="true">Available</option><option value="false">Unavailable</option></select></label><label class="full">Description<textarea id="description" rows="2"></textarea></label><button type="submit">Add food item</button></form><p id="formMessage" class="notice" role="status"></p></section><div class="menu-tools"><input id="searchFood" placeholder="Search food or category..."></div><div class="table-wrap"><table class="menu-table"><thead><tr><th>ID</th><th>Food</th><th>Category</th><th>Price</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="foodList"><tr><td colspan="7">Loading...</td></tr></tbody></table></div></main><footer>© 2026 Sathvika's Restaurant</footer><script src="common.js"></script><script src="menu.js"></script></body></html>
