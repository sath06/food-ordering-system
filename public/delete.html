<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete Food | Sathvika's Restaurant</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a class="brand" href="/">🍽️ Sathvika's Restaurant</a><nav><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/orders.html">Orders</a></nav></header><main class="page-shell narrow"><section class="admin-form"><h1>Delete a food item</h1><p>For safety, confirm the food ID before deleting. This change is applied to MySQL.</p><form id="deleteForm"><label>Food ID<input id="foodId" type="number" min="1" required></label><button class="danger">Delete item</button></form><p id="message" class="notice" role="status"></p><a href="/menu.html">← Back to menu</a></section></main><script src="common.js"></script><script>document.getElementById('deleteForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('foodId').value;if(!confirm(`Delete food item ID ${id} permanently?`))return;try{const r=await fetch(`/api/food/${id}`,{method:'DELETE'}),d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('message').textContent=d.message;}catch(err){document.getElementById('message').textContent=err.message;}});</script></body></html>
